<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Schedule</title>

<style>

:root{
    --dad:#c8e0ea;
    --mum:#ead9cf;

    --border:#173247;
    --button:#155a7c;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
}

.header{
    position:sticky;
    top:0;
    background:white;
    padding:12px;
    z-index:100;
}

.controls{
    display:flex;
    gap:8px;
}

button{
    flex:1;
    border:none;
    background:var(--button);
    color:white;
    font-size:18px;
    font-weight:bold;
    padding:14px;
    cursor:pointer;
}

.calendar{
    padding:10px;
}

.day-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.date-box{
    width:82px;
    border:2px solid var(--border);
    border-radius:10px;
    background:#f4f4f4;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    font-weight:bold;
}

.date-number{
    font-size:18px;
}

.day-name{
    font-size:13px;
}

.periods{
    flex:1;
    border:2px solid var(--border);
    border-radius:10px;
    overflow:hidden;
}

.period{
    height:30px;
}

.am{
    border-bottom:1px solid var(--border);
}

.dad{
    background:var(--dad);
}

.mum{
    background:var(--mum);
}

.today{
    outline:4px solid #ff9800;
}

#datePickerDialog{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:9999;
    padding-top:80px;
}

.dialog{
    background:white;
    padding:20px;
    width:290px;
    border-radius:12px;
    max-height:80vh;
    overflow-y:auto;
}



.dialog input{
    width:100%;
    font-size:18px;
    padding:10px;
    margin-bottom:10px;
}

.dialog button{
    width:100%;
    margin-bottom:8px;
}

.legend{
    display:flex;
    gap:10px;
    padding:0 10px 10px 10px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
}

.legend-color{
    width:18px;
    height:18px;
    border:1px solid #333;
}
#changeDialog{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:9999;
    padding-top:80px;
}

#changeDialog select,
#changeDialog input{
    width:100%;
    font-size:16px;
    padding:10px;
    margin-bottom:10px;
}
.secondary-controls{
    display:flex;
    gap:8px;
    padding-top:8px;
}

.secondary-controls button{
    flex:1;
}
#manageDialog{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:9999;
    padding-top:80px;
}
.dialog{
    background:white;
    padding:20px;
    width:290px;
    border-radius:12px;
    max-height:80vh;
    overflow-y:auto;
}
#changesList{
    max-height:400px;
    overflow-y:auto;
}
.balanceBar{
    position:sticky;
    bottom:0;
    background:white;
    border-top:2px solid var(--border);
    padding:12px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    z-index:50;
}
</style>

</head>
<body>

<div class="header">

    <div class="controls">
        <button id="gotoBtn">GO TO DATE</button>
        <button id="todayBtn">TODAY</button>
    </div>
    <div class="secondary-controls">
        <button id="changeBtn">
            CHANGE DATE
       </button>

        <button id="manageBtn">
            MANAGE CHANGES
        </button>
    </div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background:var(--dad)"></div>
            Ross
        </div>

        <div class="legend-item">
            <div class="legend-color" style="background:var(--mum)"></div>
            Jaana
        </div>
</div>
</div>

<div class="calendar" id="calendar"></div>

<div id="datePickerDialog">

    <div class="dialog">

        <input type="date" id="datePicker">

        <button id="goButton">GO</button>

        <button id="closeButton">CLOSE</button>

    </div>

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    updateDoc

}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAx9eYFOutYsHHPIi_-_bfn0UG-3kcyOEQ",
  authDomain: "kidschedule-9872f.firebaseapp.com",
  projectId: "kidschedule-9872f",
  storageBucket: "kidschedule-9872f.firebasestorage.app",
  messagingSenderId: "1002124886499",
  appId: "1:1002124886499:web:a695fea638d39e043d60d6",
  measurementId: "G-H5075D97M1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

console.log("Firebase connected");


const START_DATE = new Date('2026-11-20');
const END_DATE   = new Date('2035-12-31');

const DAY_NAMES = [
'Sun','Mon','Tue','Wed','Thu','Fri','Sat'
];

/*
Starting Friday PM.

Dad:
6,4,4

Mum:
4,6,4

Total = 28 periods
*/

const cycle = [
'D','D','D','D','D','D',
'M','M','M','M',
'D','D','D','D',
'M','M','M','M','M','M',
'D','D','D','D',
'M','M','M','M'
];

const calendarSlots = {};

function daysBetween(d1,d2)
{
    return Math.floor(
        (d1-d2)/(1000*60*60*24)
    );
}

function ownerForPeriod(periodIndex)
{
    return cycle[
        ((periodIndex % 28)+28)%28
    ];
}

function formatDate(date)
{
    return `${date.getDate()}.${date.getMonth()+1}`;
}

function buildCalendar()
{
    const calendar =
        document.getElementById("calendar");

    let current =
        new Date(START_DATE);

    const today = new Date();

    while(current <= END_DATE)
    {
        const row =
            document.createElement("div");

        row.className = "day-row";

        const dateBox =
            document.createElement("div");

        dateBox.className = "date-box";

        const dateNumber =
            document.createElement("div");

        dateNumber.className =
            "date-number";

        dateNumber.textContent =
            formatDate(current);

        const dayName =
            document.createElement("div");

        dayName.className =
            "day-name";

        dayName.textContent =
            DAY_NAMES[current.getDay()];

        dateBox.appendChild(dateNumber);
        dateBox.appendChild(dayName);

        const periods =
            document.createElement("div");

        periods.className = "periods";

        const dayOffset =
            daysBetween(current, START_DATE);

        const amIndex =
            dayOffset*2 - 1;

        const pmIndex =
            dayOffset*2;

        const amOwner =
            ownerForPeriod(amIndex);

        const pmOwner =
            ownerForPeriod(pmIndex);

        const am =
            document.createElement("div");

        am.className =
            `period am ${
                amOwner==='D'
                ? 'dad'
                : 'mum'
            }`;

        const pm =
            document.createElement("div");

        pm.className =
            `period ${
                pmOwner==='D'
                ? 'dad'
                : 'mum'
            }`;


        
        const id =
        current.toISOString()
               .substring(0,10);

        row.id = id;

        periods.appendChild(am);
        periods.appendChild(pm);
        
        calendarSlots[id] = {
            am,
            pm
        };

        row.appendChild(dateBox);
        row.appendChild(periods);





        const sameDate =
            current.getFullYear() === today.getFullYear()
            &&
            current.getMonth() === today.getMonth()
            &&
            current.getDate() === today.getDate();

        if(sameDate)
        {
            row.classList.add('today');
        }

        calendar.appendChild(row);

        current.setDate(
            current.getDate()+1
        );
    }
}

buildCalendar();
await loadOverrides();
const dialog =
document.getElementById(
    "datePickerDialog"
);

document.getElementById(
    "gotoBtn"
).onclick = () =>
{
    dialog.style.display='flex';
};

document.getElementById(
    "closeButton"
).onclick = () =>
{
    dialog.style.display='none';
};

document.getElementById(
    "goButton"
).onclick = () =>
{
    const value =
      document.getElementById(
        "datePicker"
      ).value;

    if(!value) return;

    const target =
      document.getElementById(value);

    if(target)
    {
        target.scrollIntoView({
            behavior:'smooth',
            block:'center'
        });
    }

    dialog.style.display='none';
};

document.getElementById(
    "todayBtn"
).onclick = () =>
{
    const today =
    new Date()
      .toISOString()
      .substring(0,10);

    const target =
      document.getElementById(today);

    if(target)
    {
        target.scrollIntoView({
            behavior:'smooth',
            block:'center'
        });
    }
};
function calculateBalance()
{
    let balance = 0;

    const rows =
        document.querySelectorAll(".day-row");

    rows.forEach(row =>
    {
        const dateId = row.id;

        if(!dateId || !calendarSlots[dateId]) return;

        const currentDate =
            new Date(dateId);

        const dayOffset =
            daysBetween(currentDate, START_DATE);

        const amIndex = dayOffset * 2 - 1;
        const pmIndex = dayOffset * 2;

        const originalAm =
            ownerForPeriod(amIndex);

        const originalPm =
            ownerForPeriod(pmIndex);

        const amRoss =
            calendarSlots[dateId]
            .am
            .classList
            .contains("dad");

        const pmRoss =
            calendarSlots[dateId]
            .pm
            .classList
            .contains("dad");

        const actualAm =
            amRoss ? "D" : "M";

        const actualPm =
            pmRoss ? "D" : "M";

        if(originalAm === "M" && actualAm === "D")
            balance += 0.5;

        if(originalAm === "D" && actualAm === "M")
            balance -= 0.5;

        if(originalPm === "M" && actualPm === "D")
            balance += 0.5;

        if(originalPm === "D" && actualPm === "M")
            balance -= 0.5;
    });

    const days = Math.round(Math.abs(balance));

    let text = "All square";

    if(days > 0)
    {
        if(balance > 0)
        {
            text =
                `Ross ${days} day${days===1?"":"s"} extra`;
        }
        else
        {
            text =
                `Jaana ${days} day${days===1?"":"s"} extra`;
        }
    }

    document.getElementById("balanceBar")
        .textContent = text;
}
async function loadOverrides()
{
    const snapshot =
        await getDocs(
            collection(db,"overrides")
        );

    snapshot.forEach(doc =>
{
    const override = {
        id: doc.id,
        ...doc.data()
};

    console.log(
        "Applying override:",
        override
    );

    applyOverride(override);
});
    calculateBalance();
}

function applyOverride(override)
{
    const person =
        override.person;

    const action =
        override.action;

    const fromDate =
        new Date(override.from);

    const toDate =
        new Date(override.to);

    let owner;

    if(action === "wants")
    {
        owner = person;
    }
    else
    {
        owner =
            person === "Ross"
            ? "Jaana"
            : "Ross";
    }

    let current =
        new Date(fromDate);

    while(current <= toDate)
    {
        const id =
            current.toISOString()
                   .substring(0,10);

        if(calendarSlots[id])
        {
            updateDay(
                calendarSlots[id],
                owner,
                current,
                fromDate,
                toDate
            );
        }

        current.setDate(
            current.getDate()+1
        );
    }
}

function updateDay(
    slot,
    owner,
    current,
    fromDate,
    toDate
)
{
    const colour =
        owner === "Ross"
        ? "dad"
        : "mum";

    const dayString =
        current.toISOString()
               .substring(0,10);

    const fromString =
        fromDate.toISOString()
                .substring(0,10);

    const toString =
        toDate.toISOString()
              .substring(0,10);

    if(dayString === fromString)
    {
        slot.pm.className =
            `period ${colour}`;
    }
    else if(dayString === toString)
    {
        slot.am.className =
            `period am ${colour}`;
    }
    else
    {
        slot.am.className =
            `period am ${colour}`;

        slot.pm.className =
            `period ${colour}`;
    }
}
async function showChanges()
{
    const container =
        document.getElementById(
            "changesList"
        );

    container.innerHTML = "";

    const snapshot =
        await getDocs(
            collection(db,"overrides")
        );

    snapshot.forEach(d =>
    {
        const o = d.data();

        const row =
            document.createElement("div");

        row.style.border =
            "1px solid #ccc";

        row.style.padding =
            "8px";

        row.style.marginBottom =
            "8px";

        row.innerHTML = `
            <b>${o.person}</b>
            (${o.action})
            <br>
            ${o.from} → ${o.to}
            <br>
            ${o.note || ""}
            <br><br>
            <button
                data-id="${d.id}"
                class="deleteBtn">
                DELETE
            </button>
        `;

        container.appendChild(row);
    });

    document
        .querySelectorAll(".deleteBtn")
        .forEach(btn =>
        {
            btn.onclick =
            async () =>
            {
                await deleteDoc(
                    doc(
                        db,
                        "overrides",
                        btn.dataset.id
                    )
                );

                await showChanges();

                location.reload();
            };
        });
}
window.onload = () =>
{
    const today =
        new Date()
        .toISOString()
        .substring(0,10);

    const target =
        document.getElementById(today);

    if(target)
    {
        setTimeout(()=>{
            target.scrollIntoView({
                block:'center'
            });
        },300);
    }
};
document.getElementById(
    "saveChangeBtn"
).onclick = async () =>
{
    const person =
        document.getElementById(
            "changePerson"
        ).value;

    const action =
        document.getElementById(
            "changeAction"
        ).value;

    const from =
        document.getElementById(
            "changeFrom"
        ).value;

    const to =
        document.getElementById(
            "changeTo"
        ).value;

    const note =
        document.getElementById(
            "changeNote"
        ).value;

    await addDoc(
        collection(db,"overrides"),
        {
            person,
            action,
            from,
            to,
            note,
            created:
                new Date()
                .toISOString()
        }
    );
    location.reload();


    changeDialog.style.display =
        "none";
};
    
try {

    const snapshot =
        await getDocs(
            collection(db, "overrides")
        );

    console.log(
        "Overrides found:",
        snapshot.docs.length
    );

}
catch(error)
{
    console.error(error);
}
    const changeDialog =
    document.getElementById(
        "changeDialog"
    );

document.getElementById(
    "changeBtn"
).onclick = () =>
{
    changeDialog.style.display =
        "flex";
};

document.getElementById(
    "closeChangeBtn"
).onclick = () =>
{
    changeDialog.style.display =
        "none";
};
const manageDialog =
    document.getElementById(
        "manageDialog"
    );

document.getElementById(
    "manageBtn"
).onclick = async () =>
{
    await showChanges();

    manageDialog.style.display =
        "flex";
};

document.getElementById(
    "closeManageBtn"
).onclick = () =>
{
    manageDialog.style.display =
        "none";
};
</script>
<div id="changeDialog">

    <div class="dialog">

        <label>Person</label>
        <select id="changePerson">
            <option>Ross</option>
            <option>Jaana</option>
        </select>

        <label style="margin-top:10px;display:block;">
            Action
        </label>

        <select id="changeAction">
            <option value="wants">Wants the kids</option>
            <option value="away">Is away</option>
        </select>

        <label style="margin-top:10px;display:block;">
            From
        </label>

        <input type="date" id="changeFrom">

        <label style="margin-top:10px;display:block;">
            To
        </label>

        <input type="date" id="changeTo">

        <label style="margin-top:10px;display:block;">
            Note (optional)
        </label>

        <input
            type="text"
            id="changeNote"
            placeholder="Holiday, dentist..."
        >

        <button id="saveChangeBtn">
            SAVE
        </button>

        <button id="closeChangeBtn">
            CANCEL
        </button>

    </div>

</div>
<div id="manageDialog">

    <div class="dialog">

        <h3>Schedule Changes</h3>

        <div id="changesList"></div>

        <button id="closeManageBtn">
            CLOSE
        </button>

    </div>

</div>
<div id="balanceBar" class="balanceBar">
    All square
</div>
</body>
</html>
